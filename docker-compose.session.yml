# Resource envelope for session runs. Used together with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.session.yml up -d
# Values come from the session (see sessions/defaults.yaml).

x-api: &api
  cpus: ${PRISM_RES_API_CPUS:-1.0}
  mem_limit: ${PRISM_RES_API_MEMORY:-512M}

x-storage: &storage
  cpus: ${PRISM_RES_STORAGE_CPUS:-1.0}
  mem_limit: ${PRISM_RES_STORAGE_MEMORY:-1G}

x-bus: &bus
  cpus: ${PRISM_RES_BUS_CPUS:-0.50}
  mem_limit: ${PRISM_RES_BUS_MEMORY:-256M}

x-observe: &observe
  cpus: ${PRISM_RES_OBSERVE_CPUS:-0.50}
  mem_limit: ${PRISM_RES_OBSERVE_MEMORY:-512M}

x-generator: &generator
  cpus: ${PRISM_RES_GENERATOR_CPUS:-1.0}
  mem_limit: ${PRISM_RES_GENERATOR_MEMORY:-512M}

services:
  go-api:
    <<: *api
  python-api:
    <<: *api
  timescaledb:
    <<: *storage
  clickhouse:
    <<: *storage
  influxdb:
    <<: *storage
  victoriametrics:
    <<: *storage
  nats:
    <<: *bus
  prometheus:
    <<: *observe
  grafana:
    <<: *observe
  postgres-exporter:
    <<: *observe
  generator:
    <<: *generator
