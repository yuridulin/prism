openapi: 3.1.0
info:
  title: Prism Time-Series API
  version: 1.2.0
    description: |
      Контракт стенда, по форме близкий к Datalake `/api/values`:
        POST — одно чтение (не массив запросов), PUT — пачка точек.

      Чтение (одно тело, не `ValuesRequest[]`):
        - `exact` — locf на момент: последняя точка с ts ≤ exact; date = сырой ts наблюдения
          (как Datalake ExactLocf), quality = CarryQuality (192 / 200 Good_LOCF / 64 LastUsable)
        - `old` + `young` — locf-seed на old (сырой ts, locf quality) + сырые точки (old, young]
        - `old` + `young` + `resolution` — сетка [old, young] шагом resolution (date = граница бакета)
        - ни exact ни old/young — locf на now

      Запись: PUT JSON-массив `{ id, value, date, quality }` (как Datalake PUT).
      Каталог — `/api/tags`. Ошибки: `{ "error": { "code", "message" } }`.
servers:
  - url: http://localhost:8081
    description: Go API
  - url: http://localhost:8083
    description: C# API
  - url: http://localhost:8084
    description: Rust API
paths:
  /healthz:
    get:
      summary: Liveness
      responses:
        "200":
          description: OK
  /readyz:
    get:
      summary: Readiness (хранилище доступно)
      responses:
        "200":
          description: Ready
        "503":
          $ref: "#/components/responses/Error"
  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        "200":
          description: Exposition format
  /api/meta:
    get:
      summary: Активный backend/storage и поддерживаемые операции
      responses:
        "200":
          description: Meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
  /v1/meta:
    get:
      summary: Alias of /api/meta
      responses:
        "200":
          description: Meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
  /api/tags:
    get:
      summary: Каталог тегов
      responses:
        "200":
          description: Tags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagList"
    post:
      summary: Upsert тегов в каталог
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagWriteRequest"
      responses:
        "200":
          description: Upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagWriteResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/values:
    post:
      summary: Чтение значений (одно тело, не массив запросов)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValuesRequest"
      responses:
        "200":
          description: Values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValuesResponse"
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    put:
      summary: Запись пачки точек
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/ValueWriteRequest"
      responses:
        "200":
          description: Written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResponse"
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    ValueWriteRequest:
      type: object
      required: [id, value]
      properties:
        id:
          type: integer
          minimum: 0
          maximum: 4294967295
        value:
          type: number
          format: float
        date:
          type: string
          format: date-time
          description: UTC. Если пусто — now().
        quality:
          type: integer
          minimum: 0
          maximum: 65535
          default: 192
          description: OPC DA quality word. 192 Good, 64 Uncertain, 0 Bad.
    WriteResponse:
      type: object
      required: [written]
      properties:
        written: { type: integer }
    ValuesRequest:
      type: object
      required: [tagsId]
      properties:
        requestKey:
          type: string
          description: Эхо в ответе
        tagsId:
          type: array
          items: { type: integer, minimum: 0, maximum: 4294967295 }
          minItems: 1
        exact:
          type: string
          format: date-time
          description: LOCF на этот момент. В ответе date = сырой ts последней точки ≤ exact, quality через CarryQuality.
        old:
          type: string
          format: date-time
          description: Начало range, включительно для LOCF-seed
        young:
          type: string
          format: date-time
          description: Конец range
        resolution:
          type: string
          description: Шаг сетки sample (1s, 1m, 1h, 1d). Вместе с old/young включает sample, не сырой range.
    ValueRecord:
      type: object
      required: [date, value, quality]
      properties:
        date: { type: string, format: date-time }
        value: { type: number, format: float }
        quality: { type: integer }
    ValuesTag:
      type: object
      required: [id, values]
      properties:
        id: { type: integer }
        values:
          type: array
          items:
            $ref: "#/components/schemas/ValueRecord"
    ValuesResponse:
      type: object
      required: [tags]
      properties:
        requestKey: { type: string }
        tags:
          type: array
          items:
            $ref: "#/components/schemas/ValuesTag"
    Tag:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, minimum: 0, maximum: 4294967295 }
        name: { type: string }
        unit: { type: string }
    TagList:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
    TagWriteRequest:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
    TagWriteResponse:
      type: object
      required: [upserted]
      properties:
        upserted: { type: integer }
    Meta:
      type: object
      required: [backend, storage, storages, contract, ops]
      properties:
        backend: { type: string }
        storage: { type: string }
        storages:
          type: array
          items: { type: string }
        contract: { type: string, examples: ["v1.2"] }
        ops:
          type: array
          items: { type: string, enum: [write, locf, range, sample, tags] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_request, not_found, storage_unavailable, storage_error]
            message: { type: string }
