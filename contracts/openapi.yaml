openapi: 3.1.0
info:
  title: Prism Time-Series API
  version: 1.1.0
  description: |
    Единый контракт для всех бэкендов стенда (Go, Python, C#, Rust).

    Модель — каталог тегов + append-only ряды:
      ts (UTC), tag_id (uint32), value (float32), quality (OPC DA uint16).

    Чтение:
      1. locf   — last observation carried forward на момент `at` (основной)
      2. range  — locf на `from` + все точки (from, to] (основной)
      3. sample — range, затем сэмплирование с протяжкой LOCF
      4. twavg  — range, затем средневзвешенное по времени

    Канонические операции — POST. Ошибки: `{ "error": { "code", "message" } }`.
    Хранилище выбирается `PRISM_STORAGE`.
servers:
  - url: http://localhost:8081
    description: Go API
  - url: http://localhost:8082
    description: Python API
  - url: http://localhost:8083
    description: C# API
  - url: http://localhost:8084
    description: Rust API
paths:
  /healthz:
    get:
      summary: Liveness
      responses:
        "200":
          description: OK
  /readyz:
    get:
      summary: Readiness (хранилище доступно)
      responses:
        "200":
          description: Ready
        "503":
          $ref: "#/components/responses/Error"
  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        "200":
          description: Exposition format
  /v1/meta:
    get:
      summary: Активный backend/storage и поддерживаемые операции
      responses:
        "200":
          description: Meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
  /v1/tags:
    get:
      summary: Каталог тегов
      responses:
        "200":
          description: Tags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagList"
    post:
      summary: Upsert тегов в каталог
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagWriteRequest"
      responses:
        "200":
          description: Upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagWriteResponse"
        "400":
          $ref: "#/components/responses/Error"
  /v1/write:
    post:
      summary: Дописать пачку сэмплов
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteRequest"
      responses:
        "200":
          description: Written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResponse"
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /v1/read:
    post:
      summary: Чтение в одном из четырёх режимов
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadRequest"
      responses:
        "200":
          description: Series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadResult"
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /v1/locf:
    post:
      summary: Exact LOCF (mode=locf)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocfRequest"
      responses:
        "200":
          description: Series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadResult"
        "400":
          $ref: "#/components/responses/Error"
  /v1/range:
    post:
      summary: LOCF + start..end (mode=range)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RangeRequest"
      responses:
        "200":
          description: Series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadResult"
        "400":
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Sample:
      type: object
      required: [tag_id, value]
      properties:
        ts:
          type: string
          format: date-time
          description: UTC. Если пусто на записи — now().
        tag_id:
          type: integer
          minimum: 0
          maximum: 4294967295
        value:
          type: number
          format: float
        quality:
          type: integer
          minimum: 0
          maximum: 65535
          default: 192
          description: |
            OPC DA quality word.
            192 (0xC0) Good, 64 (0x40) Uncertain, 0 Bad.
        carried:
          type: boolean
          description: true, если значение протянуто LOCF, а не записано в этой точке
    WriteRequest:
      type: object
      required: [samples]
      properties:
        samples:
          type: array
          items:
            $ref: "#/components/schemas/Sample"
    WriteResponse:
      type: object
      required: [written]
      properties:
        written: { type: integer }
    ReadMode:
      type: string
      enum: [locf, range, sample, twavg]
    ReadRequest:
      type: object
      required: [mode, tag_ids]
      properties:
        mode:
          $ref: "#/components/schemas/ReadMode"
        tag_ids:
          type: array
          items: { type: integer, minimum: 0, maximum: 4294967295 }
          minItems: 1
        at:
          type: string
          format: date-time
          description: Обязателен для locf
        from:
          type: string
          format: date-time
          description: Обязателен для range / sample / twavg
        to:
          type: string
          format: date-time
        step:
          type: string
          default: 1m
          description: Шаг сэмплирования, обязателен для sample
    LocfRequest:
      type: object
      required: [tag_ids, at]
      properties:
        tag_ids:
          type: array
          items: { type: integer }
        at:
          type: string
          format: date-time
    RangeRequest:
      type: object
      required: [tag_ids, from, to]
      properties:
        tag_ids:
          type: array
          items: { type: integer }
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    Series:
      type: object
      required: [tag_id, samples]
      properties:
        tag_id: { type: integer }
        value:
          type: number
          description: Результат twavg
        samples:
          type: array
          items:
            $ref: "#/components/schemas/Sample"
    ReadResult:
      type: object
      required: [mode, series]
      properties:
        mode:
          $ref: "#/components/schemas/ReadMode"
        at: { type: string, format: date-time }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        step: { type: string }
        series:
          type: array
          items:
            $ref: "#/components/schemas/Series"
    Tag:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, minimum: 0, maximum: 4294967295 }
        name: { type: string }
        unit: { type: string }
    TagList:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
    TagWriteRequest:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
    TagWriteResponse:
      type: object
      required: [upserted]
      properties:
        upserted: { type: integer }
    Meta:
      type: object
      required: [backend, storage, storages, contract, ops]
      properties:
        backend: { type: string }
        storage: { type: string }
        storages:
          type: array
          items: { type: string }
        contract: { type: string, examples: ["v1.1"] }
        ops:
          type: array
          items: { type: string, enum: [write, locf, range, sample, twavg, tags] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_request, not_found, storage_unavailable, storage_error]
            message: { type: string }
