# Starting characteristics for a new session.
# Arena: C# × Timescale / VictoriaMetrics. Go/Rust were the language experiment;
# QuestDB is out of this comparison. Adapters stay in apps/ for --pairs.

duration: 5m
dispatch: parallel-by-backend

load:
  profile: iot-steady
  transport: ""

pairs:
  - { backend: csharp, storage: timescaledb }
  - { backend: csharp, storage: victoriametrics }

resources:
  api:
    cpus: "1.0"
    memory: 512M
  storage:
    cpus: "1.0"
    memory: 1G
  bus:
    cpus: "0.50"
    memory: 256M
  observe:
    cpus: "0.50"
    memory: 512M
  generator:
    cpus: "1.0"
    memory: 512M
