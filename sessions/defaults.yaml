# Starting characteristics for a new session.
# Matrix: 3 API (Go, C#, Rust) × 3 storage (Timescale, QuestDB, VictoriaMetrics).

duration: 5m
dispatch: parallel-by-backend

load:
  profile: iot-steady
  transport: ""

pairs:
  - { backend: go, storage: timescaledb }
  - { backend: go, storage: questdb }
  - { backend: go, storage: victoriametrics }
  - { backend: csharp, storage: timescaledb }
  - { backend: csharp, storage: questdb }
  - { backend: csharp, storage: victoriametrics }
  - { backend: rust, storage: timescaledb }
  - { backend: rust, storage: questdb }
  - { backend: rust, storage: victoriametrics }

resources:
  api:
    cpus: "1.0"
    memory: 512M
  storage:
    cpus: "1.0"
    memory: 1G
  bus:
    cpus: "0.50"
    memory: 256M
  observe:
    cpus: "0.50"
    memory: 512M
  generator:
    cpus: "1.0"
    memory: 512M
