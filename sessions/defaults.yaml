# Starting characteristics for a new session.
# Default dispatch: all DBs stay up per backend; only the API storage target changes.

duration: 5m
dispatch: by-backend

load:
  profile: iot-steady
  # empty = use the profile's own transport
  transport: ""

pairs:
  - { backend: go, storage: questdb }
  - { backend: go, storage: clickhouse }
  - { backend: csharp, storage: questdb }
  - { backend: rust, storage: questdb }

resources:
  api:
    cpus: "1.0"
    memory: 512M
  storage:
    cpus: "1.0"
    memory: 1G
  bus:
    cpus: "0.50"
    memory: 256M
  observe:
    cpus: "0.50"
    memory: 512M
  generator:
    cpus: "1.0"
    memory: 512M
