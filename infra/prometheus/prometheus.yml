global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: go-api
    static_configs:
      - targets: ["go-api:8081"]
        labels:
          backend: go
  - job_name: python-api
    static_configs:
      - targets: ["python-api:8082"]
        labels:
          backend: python
  - job_name: victoriametrics
    static_configs:
      - targets: ["victoriametrics:8428"]
  - job_name: nats
    metrics_path: /metrics
    static_configs:
      - targets: ["nats:8222"]
