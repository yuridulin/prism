name: prism

services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prism}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prism}
      POSTGRES_DB: ${POSTGRES_DB:-prism}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./infra/timescaledb/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prism} -d ${POSTGRES_DB:-prism}"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-prism}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-prism}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-prism}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./infra/clickhouse/config.d/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "${CLICKHOUSE_USER:-prism}", "--password", "${CLICKHOUSE_PASSWORD:-prism}", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER:-prism}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:-prismprism}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-prism}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-prism}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:-prism-dev-token}
      DOCKER_INFLUXDB_INIT_RETENTION: 7d
    ports:
      - "${INFLUX_PORT:-8086}:8086"
    volumes:
      - influx_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.110.0
    restart: unless-stopped
    command:
      - "--storageDataPath=/victoria-metrics-data"
      - "--httpListenAddr=:8428"
      - "--retentionPeriod=7d"
    ports:
      - "${VM_PORT:-8428}:8428"
    volumes:
      - vm_data:/victoria-metrics-data
    # Official image is scratch-based; readiness is checked by the APIs.

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-m", "8222"]
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # Dispatcher starts only the active pair; do not pull unused APIs/DBs.

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-prism}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  go-api:
    build:
      context: ./apps/go-api
    restart: unless-stopped
    environment:
      PRISM_STORAGE: ${GO_API_STORAGE:-timescaledb}
      HTTP_ADDR: ":8081"
      POSTGRES_DSN: postgres://${POSTGRES_USER:-prism}:${POSTGRES_PASSWORD:-prism}@timescaledb:5432/${POSTGRES_DB:-prism}?sslmode=disable
      CLICKHOUSE_DSN: clickhouse://${CLICKHOUSE_USER:-prism}:${CLICKHOUSE_PASSWORD:-prism}@clickhouse:9000/${CLICKHOUSE_DB:-prism}
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN:-prism-dev-token}
      INFLUX_ORG: ${INFLUX_ORG:-prism}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-prism}
      VM_URL: http://victoriametrics:8428
      NATS_URL: nats://nats:4222
      NATS_SUBJECT: ${NATS_SUBJECT:-prism.points}
    ports:
      - "${GO_API_PORT:-8081}:8081"
    depends_on:
      nats:
        condition: service_started

  python-api:
    build:
      context: ./apps/python-api
    restart: unless-stopped
    environment:
      PRISM_STORAGE: ${PYTHON_API_STORAGE:-influxdb}
      HTTP_ADDR: "0.0.0.0:8082"
      POSTGRES_DSN: postgres://${POSTGRES_USER:-prism}:${POSTGRES_PASSWORD:-prism}@timescaledb:5432/${POSTGRES_DB:-prism}
      CLICKHOUSE_URL: http://${CLICKHOUSE_USER:-prism}:${CLICKHOUSE_PASSWORD:-prism}@clickhouse:8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-prism}
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN:-prism-dev-token}
      INFLUX_ORG: ${INFLUX_ORG:-prism}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-prism}
      VM_URL: http://victoriametrics:8428
      NATS_URL: nats://nats:4222
      NATS_SUBJECT: ${NATS_SUBJECT:-prism.points}
    ports:
      - "${PYTHON_API_PORT:-8082}:8082"
    depends_on:
      nats:
        condition: service_started

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-prism}:${POSTGRES_PASSWORD:-prism}@timescaledb:5432/${POSTGRES_DB:-prism}?sslmode=disable
    depends_on:
      timescaledb:
        condition: service_healthy

  generator:
    build:
      context: ./ingest/generator
    profiles: ["load"]
    environment:
      PROFILE: ${LOAD_PROFILE:-iot-steady}
      PROFILES_DIR: /profiles
      TARGET: ${GENERATOR_TARGET:-}
      HTTP_URL: ${GENERATOR_HTTP_URL:-http://go-api:8081}
      NATS_URL: nats://nats:4222
      NATS_SUBJECT: ${NATS_SUBJECT:-prism.points}
      DURATION: ${GENERATOR_DURATION:-}
    volumes:
      - ./profiles:/profiles:ro
    depends_on:
      nats:
        condition: service_started

volumes:
  timescale_data:
  clickhouse_data:
  influx_data:
  vm_data:
  prometheus_data:
  grafana_data:
