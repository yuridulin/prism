name: sinus-like
description: >-
  Sinus-shaped load above production: 14-day minute archive (600 tags),
  locf/range on 15 ids, windows 1d/7d/14d, and 2k points/s live ingest
  during reads (~56× prod INOPC). This is the decision profile, not a
  replay of 36/s and not a write-only ceiling.

transport: http
duration: 0

# Matches bench/profiles/dataset-workload.yaml history:
#   600 tags × 14d × 1 min ≈ 12.1M points, plus a thin hourly class for mixed sets.
# Seed is COPY/ILP through the API; Timescale on the 1G envelope may need 2G RAM
# for this profile (Sinus bench-timescale default is 2GiB). Do not change
# sessions/defaults.yaml globally — override resources for this session only.
archive:
  enabled: true
  span: 14d
  batch: 2000
  workers: 4
  tags:
    - { class: minute, start: 1, count: 600, period: 1m }
    - { class: hour, start: 601, count: 400, period: 1h }

# Prod 2.15 INOPC ≈ 36/s. Offer 2k/s (iot-steady) on the same tag_id space
# as the archive so locf/range compete with a writer that is already 50×+ prod.
# Generator runs ingest workers during the query-grid phase.
ingest:
  enabled: true
  rate: 2000
  batch: 100
  workers: 1
  tag_start: 1
  tag_count: 1000
  good_ratio: 0.98
  out_of_order: 0.0
  late_ms: 0

# Heavier than sinus completed ~4.5 qps and than prod values_read ~26/s
# of mostly-current: offer 16/s with 7d/14d raw range in the mix.
# Range stays `range` (raw) so scorecard locf/range p95 still populate;
# Sinus List = this payload + C# stretch — storage cost is the raw read.
query:
  enabled: true
  rate: 16
  workers: 8
  rng_seed: 42
  tags_per_request: 15
  tag_sets:
    - { class: minute, size: 15 }
    - { class: minute, size: 1 }
    - { class: hour, size: 15 }
  at_offsets: [0s, 0s, 0s, 1d, 7d, 14d]
  end_offsets: [0s]
  mix:
    - { op: locf, weight: 6 }
    - { op: range, weight: 1, window: 1d }
    - { op: range, weight: 1, window: 7d }
    - { op: range, weight: 1, window: 14d }
