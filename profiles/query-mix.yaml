name: query-mix
description: Ingest plus the two main read modes, with light sample/twavg.

transport: http
duration: 0

ingest:
  enabled: true
  rate: 500
  batch: 50
  workers: 1
  tag_start: 1
  tag_count: 250
  good_ratio: 0.98
  out_of_order: 0.0
  late_ms: 0

query:
  enabled: true
  rate: 40
  mix:
    - { op: locf, weight: 50 }
    - { op: range, weight: 40, window: 15m }
    - { op: sample, weight: 7, window: 15m, step: 1m }
    - { op: twavg, weight: 3, window: 15m }
